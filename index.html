<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b18">
  <title>Quantum Chat | BB84 Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-glow glow-one"></div>
  <div class="login-glow glow-two"></div>

  <main class="login-card">
    <div class="brand-mark">Q<span>+</span></div>
    <p class="eyebrow">QUANTUM COMMUNICATION LAB</p>
    <h1>Quantum Chat</h1>
    <p class="login-subtitle">
      Explore BB84 key distribution, probability theory, random processes
      and eavesdropping detection.
    </p>

    <form id="login-form">
      <label for="username">Display name</label>
      <input id="username" maxlength="32" placeholder="Enter your display name"
             autocomplete="nickname" required>

      <label for="login-role">Choose role</label>
      <select id="login-role">
        <option value="Alice">Alice · Sender</option>
        <option value="Bob">Bob · Receiver</option>
      </select>

      <button class="primary-btn login-button" type="submit">
        Enter quantum chat ↗
      </button>
    </form>

    <div class="login-features">
      <span>● BB84 simulation</span>
      <span>● PTRP analytics</span>
      <span>● Eve attack demo</span>
    </div>

    <p class="disclaimer">
      Academic prototype only. Not for sensitive or private communications.
    </p>
  </main>

  <script>
    const username = document.getElementById("username");
    const role = document.getElementById("login-role");

    username.value = localStorage.getItem("quantum_display_name") || "";
    role.value = localStorage.getItem("quantum_role") || "Alice";

    document.getElementById("login-form").addEventListener("submit", event => {
      event.preventDefault();

      const name = username.value.trim();
      if (!name) {
        username.focus();
        return;
      }

      localStorage.setItem("quantum_display_name", name.slice(0, 32));
      localStorage.setItem("quantum_role", role.value);
      location.href = "chat.html";
    });
  </script>
</body>
</html>
